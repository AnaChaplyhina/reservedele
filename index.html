<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservedele · Power Ejby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js"></script>
<style>
:root{
  --green-dark:#082600; --green:#008545; --red:#E62B27;
  --beige:#F4F4EF; --beige-dark:#E8EAE3;
  --ink:#082600; --muted:#66705F; --line:#D7DBD0; --line-soft:#E4E7DE; --r:4px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--beige);color:var(--ink);
  font:400 15px/1.5 Raleway,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}

header{background:var(--green-dark);color:var(--beige)}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:22px 0 0}
.kicker{font:500 10px/1 Raleway;letter-spacing:.24em;text-transform:uppercase;opacity:.55;margin-bottom:7px}
.hname{font:300 23px/1 Raleway}
.hright{display:flex;align-items:center;gap:12px;flex:none}
.langs{display:flex;gap:1px}
.langs button,.adm{background:none;border:1px solid rgba(244,244,239,.26);color:var(--beige);
  font:500 11px/1 Raleway;letter-spacing:.12em;padding:8px 12px;cursor:pointer;border-radius:var(--r);white-space:nowrap}
.langs button[aria-pressed=true]{background:var(--beige);color:var(--green-dark);border-color:var(--beige)}
.adm.on{background:var(--green);border-color:var(--green)}
nav{display:flex;gap:22px;margin-top:22px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--beige);
  font:400 14px/1 Raleway;padding:0 0 13px;cursor:pointer;opacity:.55;white-space:nowrap}
nav button[aria-selected=true]{opacity:1;border-bottom-color:var(--green)}
nav button[hidden]{display:none}
.chip{display:inline-block;min-width:17px;height:17px;line-height:17px;text-align:center;background:var(--red);
  color:#fff;font:600 10px Raleway;border-radius:9px;padding:0 5px;margin-left:6px}

main{padding:30px 0 90px}
.view[hidden]{display:none}
h2{font:300 27px/1.2 Raleway;letter-spacing:-.01em;margin:0 0 5px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 24px;max-width:66ch}
.lab{display:block;font:500 10px/1 Raleway;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sec{display:flex;align-items:baseline;gap:12px;margin:32px 0 14px;border-left:2px solid var(--green);padding-left:11px}
.sec h3{font:500 13px/1 Raleway;letter-spacing:.09em;text-transform:uppercase;margin:0}
.sec .hint{font-size:12px;color:var(--muted)}
.sec .sp{margin-left:auto}
.panel{background:#fff;border:1px solid var(--line-soft);border-radius:var(--r);padding:22px}
.panel.flush{padding:4px 18px}
.split{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:start}

input,select,textarea{width:100%;font:400 15px Raleway;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:var(--r);padding:11px 12px}
input:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(0,133,69,.13)}
.f{margin-bottom:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.unit{float:right;font:400 11px Raleway;letter-spacing:0;text-transform:none;color:var(--muted)}
.btn{background:var(--green-dark);color:var(--beige);border:0;border-radius:var(--r);
  font:500 15px Raleway;padding:14px 18px;cursor:pointer;width:100%}
.btn:hover{background:#0d3a02}
.btn.alt{background:var(--beige-dark);color:var(--ink)}
.btn.sm{width:auto;font-size:12.5px;padding:8px 13px}
.txt{background:none;border:0;color:var(--green);font:500 12.5px Raleway;cursor:pointer;
  padding:3px 0;text-decoration:underline;text-underline-offset:3px}
.txt.mut{color:var(--muted)}

.combo{position:relative}
.combo input[aria-expanded=true]{border-radius:var(--r) var(--r) 0 0}
.opts{position:absolute;z-index:30;left:0;right:0;top:100%;margin:0;padding:4px 0;list-style:none;background:#fff;
  border:1px solid var(--green);border-top:0;border-radius:0 0 var(--r) var(--r);max-height:300px;overflow:auto;
  box-shadow:0 8px 22px rgba(8,38,0,.09)}
.opts li{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center}
.opts li[aria-selected=true]{background:var(--beige)}
.opts li .r{font-size:11.5px;color:var(--muted);flex:none;text-align:right}
.opts li.mk{color:var(--green);font-weight:500}
.opts li.none{color:var(--muted);cursor:default}
.combo mark{background:rgba(0,133,69,.16);color:inherit;border-radius:2px}
.sml{font-size:11.5px;color:var(--muted)}
.opts .sml{display:block}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:500 10px Raleway;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  padding:12px 9px;border-bottom:1px solid var(--line)}
td{padding:11px 9px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.rk{color:var(--muted);font-variant-numeric:tabular-nums;padding-right:5px}
.mono{font-variant-numeric:tabular-nums;font-size:13px}
.tag{display:inline-block;background:var(--beige-dark);border-radius:3px;padding:2px 7px;font-size:11.5px;white-space:nowrap}
.tag.ord{border:1px solid var(--green);background:rgba(0,133,69,.07)}
.alias{display:inline-block;border:1px solid var(--line);border-radius:3px;padding:1px 6px;font-size:11px;color:var(--muted);margin:2px 3px 0 0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:7px;flex:none}
.dot.low{background:#C8A200}
.dot.nul{background:var(--red)}
.dot.ukendt{background:var(--line)}
.flagpl{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500}
.flagpl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red)}
.empty{padding:26px 10px;color:var(--muted);font-size:13.5px;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:#fff;border:1px solid var(--line-soft);border-radius:var(--r);padding:16px 18px}
.kpi .v{font:300 26px/1.1 Raleway;font-variant-numeric:tabular-nums}
.kpi .k{font:500 10px Raleway;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.filters .f{margin:0;min-width:150px}
.filters .grow{flex:1;min-width:220px}
.rec{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.rec:last-child{border-bottom:0}
.warn{background:#fff8e6;border:1px solid #ecd58c;border-radius:var(--r);padding:10px 14px;font-size:12.5px;margin-bottom:20px}
.ordbox{background:var(--beige-dark);border-radius:var(--r);padding:14px 16px;font:400 13px/1.7 Raleway;white-space:pre-wrap;margin:12px 0 4px}
input[type=checkbox]{width:auto;padding:0;accent-color:#008545}
.medscan{display:flex;gap:8px;align-items:flex-start}
.medscan .combo,.medscan>input{flex:1;min-width:0}
.scanbtn{flex:none;padding:11px 14px}
.navn-knap{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.navn-knap:hover{text-decoration:underline;text-underline-offset:3px}
.histbox{background:var(--beige);border-radius:var(--r);padding:14px 16px;margin:2px 0}
.histbox table{font-size:13px}
.histbox td,.histbox th{padding:7px 8px}
.plus{color:var(--green);font-weight:500}
.modal{position:fixed;inset:0;background:rgba(8,38,0,.62);z-index:80;display:flex;
  align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.modalbox{background:var(--beige);border-radius:var(--r);padding:22px;max-width:460px;width:100%}
#scanvideo{width:100%;border-radius:var(--r);background:#000;aspect-ratio:4/3;object-fit:cover}
@media print{
  body{background:#fff}
  header,nav,.filters,.sec,#toast,.modal,.warn,.adm-only{display:none !important}
}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,90px);background:var(--green-dark);color:var(--beige);
  padding:13px 22px;border-radius:var(--r);font-size:14px;z-index:60;transition:transform .25s ease;max-width:92vw}
#toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
@media(max-width:900px){.split{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:0 15px}h2{font-size:23px}.two{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr}th,td{padding:9px 5px}.hide-s{display:none}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hrow">
      <div><div class="kicker" data-i="kicker"></div><div class="hname" data-i="apptitle"></div></div>
      <div class="hright">
        <div class="langs" id="langs">
          <button data-l="da" aria-pressed="true">DA</button>
          <button data-l="pl" aria-pressed="false">PL</button>
        </div>
        <button class="adm" id="admBtn"></button>
      </div>
    </div>
    <nav id="nav">
      <button data-t="reg" aria-selected="true"></button>
      <button data-t="lager" aria-selected="false"></button>
      <button data-t="best" aria-selected="false" hidden></button>
      <button data-t="modt" aria-selected="false" hidden></button>
      <button data-t="stat" aria-selected="false" hidden></button>
      <button data-t="koe" aria-selected="false" hidden></button>
    </nav>
  </div>
</header>

<main class="wrap">
<div class="warn" id="demo" hidden></div>

<!-- ===================== REGISTRER ===================== -->
<section class="view" id="reg">
  <h2 data-i="reg_h"></h2>
  <p class="sub" data-i="reg_s"></p>
  <div class="split">
    <div class="panel">
      <div class="f">
        <label class="lab" for="q_ud" data-i="f_ud"></label>
        <div class="combo" id="c_ud">
          <input id="q_ud" role="combobox" aria-expanded="false" aria-autocomplete="list" autocomplete="off">
          <ul class="opts" role="listbox" hidden></ul>
        </div>
      </div>
      <div class="f">
        <label class="lab" for="q_mat"><span data-i="f_mat"></span><span class="unit" id="u_enhed"></span></label>
        <div class="medscan">
          <div class="combo" id="c_mat">
            <input id="q_mat" role="combobox" aria-expanded="false" aria-autocomplete="list" autocomplete="off">
            <ul class="opts" role="listbox" hidden></ul>
          </div>
          <button class="btn alt sm scanbtn" data-scan="q_mat"></button>
        </div>
        <div class="sml" id="matinfo" style="margin-top:7px"></div>
      </div>
      <div class="two">
        <div class="f"><label class="lab" for="f_antal" data-i="f_antal"></label>
          <input id="f_antal" type="number" min="0" step="any" inputmode="decimal"></div>
        <div class="f"><label class="lab" for="f_dato" data-i="f_dato"></label>
          <input id="f_dato" type="date"></div>
      </div>
      <div class="two">
        <div class="f"><label class="lab" for="f_init" data-i="f_init"></label>
          <input id="f_init" maxlength="6" autocomplete="off"></div>
        <div class="f"><label class="lab" for="f_note" data-i="f_note"></label>
          <input id="f_note" autocomplete="off"></div>
      </div>
      <button class="btn" id="save"></button>
    </div>
    <div>
      <div class="sec" style="margin-top:0"><h3 data-i="reg_recent"></h3></div>
      <div class="panel flush"><div id="recent"></div></div>
    </div>
  </div>
</section>

<!-- ===================== LAGER ===================== -->
<section class="view" id="lager" hidden>
  <h2 data-i="lag_h"></h2>
  <p class="sub" id="lag_sub"></p>
  <div class="panel">
    <div class="filters">
      <div class="f grow"><label class="lab" for="l_sog" data-i="lag_sog"></label>
        <div class="medscan">
          <input id="l_sog" autocomplete="off">
          <button class="btn alt sm scanbtn" data-scan="l_sog"></button>
        </div></div>
      <div class="f"><label class="lab" for="l_kat" data-i="lag_kat"></label><select id="l_kat"></select></div>
      <div class="f"><label class="lab" for="l_sort" data-i="lag_sort"></label><select id="l_sort"></select></div>
      <div class="f"><label class="lab" for="l_vis" data-i="lag_vis"></label><select id="l_vis"></select></div>
      <button class="btn sm adm-only" id="l_ny"></button>
      <button class="btn alt sm adm-only" id="p_etiket"></button>
      <button class="btn alt sm adm-only" id="p_optael"></button>
    </div>
    <table><thead><tr>
      <th data-i="t_vare"></th>
      <th class="hide-s" data-i="t_nummer"></th>
      <th class="hide-s adm-only" data-i="t_lev"></th>
      <th class="hide-s" data-i="t_kat"></th>
      <th class="num" data-i="t_beh"></th>
      <th class="num adm-only" data-i="t_pris"></th>
      <th class="num adm-only"></th>
    </tr></thead><tbody id="lagerliste"></tbody></table>
    <div class="sml" id="lagerantal" style="margin-top:12px"></div>
  </div>
</section>

<!-- ===================== BESTILLING ===================== -->
<section class="view" id="best" hidden>
  <h2 data-i="be_h"></h2>
  <p class="sub" data-i="be_s"></p>
  <div class="sec"><h3 data-i="be_skal"></h3><span class="hint" data-i="be_skal_h"></span></div>
  <div id="skalbody"></div>
  <div class="sec"><h3 data-i="be_aabne"></h3><span class="hint" data-i="be_aabne_h"></span></div>
  <div class="panel flush"><table><tbody id="aabne"></tbody></table></div>
</section>

<!-- ===================== MODTAGELSE ===================== -->
<section class="view" id="modt" hidden>
  <h2 data-i="mo_h"></h2>
  <p class="sub" data-i="mo_s"></p>
  <div class="sec"><h3 data-i="mo_afventer"></h3><span class="hint" data-i="mo_afventer_h"></span></div>
  <div class="panel flush"><table><tbody id="afventer"></tbody></table></div>

  <div class="sec"><h3 data-i="mo_uden"></h3><span class="hint" data-i="mo_uden_h"></span></div>
  <div class="split">
    <div class="panel">
      <div class="f">
        <label class="lab" for="q_ind"><span data-i="f_mat"></span><span class="unit" id="u_ind"></span></label>
        <div class="medscan">
          <div class="combo" id="c_ind">
            <input id="q_ind" role="combobox" aria-expanded="false" aria-autocomplete="list" autocomplete="off">
            <ul class="opts" role="listbox" hidden></ul>
          </div>
          <button class="btn alt sm scanbtn" data-scan="q_ind"></button>
        </div>
      </div>
      <div class="three">
        <div class="f"><label class="lab" for="i_antal" data-i="mo_antal"></label>
          <input id="i_antal" type="number" min="0" step="any" inputmode="decimal"></div>
        <div class="f"><label class="lab" for="i_pris" data-i="mo_pris"></label>
          <input id="i_pris" type="number" step="any" inputmode="decimal"></div>
        <div class="f"><label class="lab" for="i_dato" data-i="f_dato"></label>
          <input id="i_dato" type="date"></div>
      </div>
      <div class="f"><label class="lab" for="i_init" data-i="f_init"></label>
        <input id="i_init" maxlength="6" autocomplete="off"></div>
      <button class="btn" id="i_save"></button>
    </div>
    <div>
      <div class="sec" style="margin-top:0"><h3 data-i="mo_recent"></h3></div>
      <div class="panel flush"><div id="modtrecent"></div></div>
    </div>
  </div>
</section>

<!-- ===================== STATISTIK ===================== -->
<section class="view" id="stat" hidden>
  <h2 data-i="st_h"></h2>
  <p class="sub" data-i="st_s"></p>
  <div class="filters">
    <div class="f"><label class="lab" for="d_fra" data-i="ov_fra"></label><input id="d_fra" type="date"></div>
    <div class="f"><label class="lab" for="d_til" data-i="ov_til"></label><input id="d_til" type="date"></div>
    <div class="f"><label class="lab" for="d_kat" data-i="lag_kat"></label><select id="d_kat"></select></div>
    <button class="btn alt sm" id="d_clear"></button>
    <button class="btn sm" id="csv"></button>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="v" id="k_kr">—</div><div class="k" data-i="k_kr"></div></div>
    <div class="kpi"><div class="v" id="k_ind">—</div><div class="k" data-i="k_ind"></div></div>
    <div class="kpi"><div class="v" id="k_top">—</div><div class="k" data-i="k_top"></div></div>
    <div class="kpi"><div class="v" id="k_vare">—</div><div class="k" data-i="k_vare"></div></div>
  </div>
  <div class="sec"><h3 data-i="st_ud"></h3><span class="hint" data-i="st_ud_h"></span></div>
  <div class="panel flush">
    <table><thead><tr>
      <th data-i="t_ud"></th><th class="num" data-i="t_ind"></th><th class="num" data-i="t_kr"></th>
    </tr></thead><tbody id="rankUd"></tbody></table>
  </div>
  <div class="split" style="margin-top:0">
    <div><div class="sec"><h3 data-i="st_ofte"></h3></div>
      <div class="panel flush"><table><tbody id="rankOfte"></tbody></table></div></div>
    <div><div class="sec"><h3 data-i="st_kat"></h3></div>
      <div class="panel flush"><table><tbody id="rankKat"></tbody></table></div></div>
  </div>
  <div class="sec"><h3 data-i="st_alle"></h3><span class="hint" data-i="st_alle_h"></span></div>
  <div class="panel flush"><table><thead><tr>
    <th data-i="t_dato"></th><th data-i="t_vare"></th><th class="num" data-i="t_antal"></th>
    <th data-i="t_til"></th><th class="hide-s" data-i="t_init"></th><th class="num" data-i="t_kr"></th><th></th>
  </tr></thead><tbody id="alle"></tbody></table></div>
</section>

<!-- ===================== NYE VARER ===================== -->
<section class="view" id="koe" hidden>
  <h2 data-i="ko_h"></h2>
  <p class="sub" data-i="ko_s"></p>
  <div class="panel flush"><table><tbody id="koeliste"></tbody></table></div>
</section>
</main>

<div id="toast"></div>

<!-- ===================== SCANNER ===================== -->
<div class="modal" id="scanmodal" hidden>
  <div class="modalbox">
    <div class="lab" data-i="scan_h" style="margin-bottom:12px"></div>
    <video id="scanvideo" playsinline muted></video>
    <div class="sml" id="scanstatus" style="margin:10px 0 14px;min-height:18px"></div>
    <button class="btn alt" id="scanluk"></button>
  </div>
</div>

<script>
/* ==================== CONFIG ==================== */
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";
const AFDELING = "Ejby";
const ADMIN_KODE_DEMO = "godik";
const DEMO = !(SUPABASE_URL && SUPABASE_ANON_KEY);
let sb = null;
if(!DEMO && window.supabase) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ==================== KATEGORITRÆ ====================
   Alonas struktur. Kode -> navn. Undergruppen hører til gruppen før punktum. */
const GRUPPER = {
 "E1":["Tavlemateriel","Wyposażenie rozdzielnic"],
 "E2":["Styringer","Sterowanie"],
 "E3":["Stik og kabler","Wtyki i kable"],
 "E4":["EL-mekanik","Mechanika elektryczna"],
 "E5":["Elektronik","Elektronika"],
 "E100":["Diverse (elektrisk)","Różne (elektryczne)"],
 "M1":["Bolt/møtrik","Śruby/nakrętki"],
 "M2":["Skrue","Wkręty"],
 "M3":["Tavle & samledåse","Rozdzielnice i puszki"],
 "M4":["Slange/fitting","Wąż/złączka"],
 "M5":["Filter","Filtry"],
 "M6":["Bøjle","Obejmy"],
 "M7":["Forskruninger","Dławnice"],
 "M100":["Diverse (mekanisk)","Różne (mechaniczne)"]
};
const UNDER = {
 "E1.1":["Sikring, automatsikring & maksimalafbryder (MCB & MCCB)","Bezpieczniki, wyłączniki nadprądowe (MCB & MCCB)"],
 "E1.2":["Fejlstrøms-/kombiafbryder (RCD & RCBO)","Wyłączniki różnicowoprądowe (RCD & RCBO)"],
 "E1.3":["Måler (inkl. RCM)","Licznik (w tym RCM)"],
 "E1.4":["Tilbehør til brydere","Akcesoria do wyłączników"],
 "E1.5":["Fordelingsklemmer","Zaciski rozdzielcze"],
 "E1.6":["Koblingsudstyr","Aparatura łączeniowa"],
 "E2.1":["Kontaktor & termorelæ","Styczniki i przekaźniki termiczne"],
 "E2.2":["Relæ","Przekaźniki"],
 "E2.3":["Signalering","Sygnalizacja"],

/* navn = type + model */
function matNavn(m){
  const typ = lang === "pl" ? (m.type_pl || m.type_da) : (m.type_da || (m.type_pl ? m.type_pl+" (PL)" : ""));
  return [typ, m.model].filter(Boolean).join(" ") || "—";
}
const manglerDa = m => !m.type_da;
const numre = m => [m.elnr && "EL "+m.elnr, m.ean, m.modelnr].filter(Boolean);
/* Søgning rammer navne, ALLE numre, hyldeplads, producent og egne søgeord.
   Flere ord søges hver for sig og i vilkårlig rækkefølge: "ringkabelsko m8"
   finder "Ringkabelsko Gul M8 L35,5mm". Mellemrum ignoreres også, så
   "SPN4607" finder "SPN 4607 FLF PLD". */
function matcher(m,q){
  if(!q) return true;
  const hay = [m.type_da,m.type_pl,m.model,m.elnr,m.ean,m.modelnr,m.placering,m.producent,
               matNavn(m),...arr(m.aliaser),katNavn(m.kategori)].filter(Boolean).join(" ").toLowerCase();
  const flad = hay.replace(/\s+/g,"");
  return q.toLowerCase().split(/\s+/).filter(Boolean)
    .every(tok => hay.includes(tok) || flad.includes(tok));
}

const aabneOrdrer = () => ORD.filter(o => o.status === "bestilt");
const erBestilt = id => aabneOrdrer().some(o => String(o.materiale_id) === String(id));
function belob(b){
  const p = b.pris != null ? b.pris : ((byId(MATS,b.materiale_id)||{}).pris || 0);
  return Math.abs(+b.antal||0) * p;
}
/* ukendt = aldrig optalt. nul = udsolgt. low = på/under minimum. */
function niveau(m){
  if(!harBevaegelse(m.id)) return "ukendt";
  const b = beholdning(m.id);
  if(b <= 0) return "nul";
  if(m.minimum > 0 && b <= m.minimum) return "low";
  return "ok";
}
const primaerLev = m => arr(m.leverandorer)[0] || "";

/* ==================== COMBOBOX ==================== */
function Combo(root,cfg){
  const inp = root.querySelector("input"), ul = root.querySelector(".opts");
  let vis = [], akt = -1, valgtId = null;
  const luk = () => { ul.hidden = true; inp.setAttribute("aria-expanded","false"); akt = -1; };
  const mk = (s,q) => { if(!q) return esc(s);
    const i = s.toLowerCase().indexOf(q.toLowerCase());
    return i<0 ? esc(s) : esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+q.length))+"</mark>"+esc(s.slice(i+q.length)); };
  function tegn(){
    const q = inp.value.trim();
    vis = cfg.items().filter(o => cfg.match(o,q)).slice(0,60);
    const exact = vis.some(o => cfg.label(o).toLowerCase() === q.toLowerCase());
    let h = vis.map((o,i) => `<li role="option" data-i="${i}" aria-selected="false">
      <span>${mk(cfg.label(o),q)}${cfg.sub && cfg.sub(o) ? `<span class="sml">${esc(cfg.sub(o))}</span>` : ""}</span>
      <span class="r">${esc(cfg.right(o)||"")}</span></li>`).join("");
    if(q && !exact && cfg.create) h += `<li role="option" class="mk" data-new="1" aria-selected="false">+ ${t("opret")} «${esc(q)}»</li>`;
    ul.innerHTML = h || `<li class="none">${t("ingen")}</li>`;
    ul.hidden = false; inp.setAttribute("aria-expanded","true"); akt = -1;
  }
  function hop(d){
    const l = [...ul.querySelectorAll("li[role=option]")]; if(!l.length) return;
    akt = (akt+d+l.length) % l.length;
    l.forEach((x,i) => x.setAttribute("aria-selected", i===akt));
    l[akt].scrollIntoView({block:"nearest"});
  }
  async function vaelg(el){
    if(el.dataset.new){ const ny = await cfg.create(inp.value.trim()); if(!ny) return;
      valgtId = ny.id; inp.value = cfg.label(ny); }
    else { const o = vis[+el.dataset.i]; if(!o) return; valgtId = o.id; inp.value = cfg.label(o); }
    luk(); cfg.onPick && cfg.onPick(valgtId);
  }
  inp.addEventListener("input", () => { valgtId = null; cfg.onPick && cfg.onPick(null); tegn(); });
  inp.addEventListener("focus", tegn);
  inp.addEventListener("keydown", e => {
    if(e.key==="ArrowDown"){ e.preventDefault(); ul.hidden ? tegn() : hop(1); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); hop(-1); }
    else if(e.key==="Enter"){ const el = ul.querySelector("li[aria-selected=true]"); if(el){ e.preventDefault(); vaelg(el); } }
    else if(e.key==="Escape") luk();
  });
  ul.addEventListener("mousedown", e => { const el = e.target.closest("li[role=option]"); if(el){ e.preventDefault(); vaelg(el); } });
  document.addEventListener("click", e => { if(!root.contains(e.target)) luk(); });
  return { get id(){ return valgtId; },
    ryd(){ valgtId=null; inp.value=""; luk(); },
    /* bruges af scanneren: sæt varen direkte uden at skrive */
    saet(o){ valgtId = o.id; inp.value = cfg.label(o); luk(); cfg.onPick && cfg.onPick(valgtId); },
    sprog(){ if(valgtId){ const o = cfg.items().find(x => String(x.id)===String(valgtId)); if(o) inp.value = cfg.label(o); }
             inp.placeholder = cfg.ph(); } };
}
const comboUd = Combo($("#c_ud"), {
  items: () => UDS,
  label: u => u.navn,                        /* anlægsnummeret — det teknikeren læser på maskinen */
  sub: u => u.model || "",
  right: u => u.ressourcenr || u.type,
  /* rammer nummer, model, type og ressourcenr., flere ord i vilkårlig rækkefølge:
     "250 trailer" og "el16" finder begge noget */
  match: (u,q) => {
    if(!q) return true;
    const hay = [u.navn,u.type,u.model,u.ressourcenr,u.serienr].filter(Boolean).join(" ").toLowerCase();
    const flad = hay.replace(/\s+/g,"");
    return q.toLowerCase().split(/\s+/).filter(Boolean)
      .every(tok => hay.includes(tok) || flad.includes(tok));
  },
  ph: () => t("ph_ud"),
  create: async navn => { const ty = (prompt(t("ny_ud_type"),"Generator")||"Andet").trim();
    const r = await db.addUd({navn, type:ty, model:"", ressourcenr:"", serienr:"", afdeling:AFDELING});
    UDS = await db.uds(); return r; }
});

/* ==================== KATEGORI-VÆLGER ==================== */
function katOptions(medAlle){
  let h = medAlle ? `<option value="">${esc(t("alle_kat"))}</option>` : `<option value=""></option>`;
  Object.keys(GRUPPER).forEach(g => {
    const under = Object.keys(UNDER).filter(u => gruppeAf(u) === g);
    h += `<optgroup label="${esc(li(GRUPPER[g]))}">`;
    h += `<option value="${g}">${esc(li(GRUPPER[g]))} — ${esc(t("hele"))}</option>`;
    under.forEach(u => h += `<option value="${u}">${esc(li(UNDER[u]))}</option>`);
    h += `</optgroup>`;
  });
  h += `<option value="__ingen">${esc(t("uden_kat"))}</option>`;
  return h;
}
function iKategori(m,valgt){
  if(!valgt) return true;
  if(valgt === "__ingen") return !m.kategori;
  if(UNDER[valgt]) return m.kategori === valgt;
  return gruppeAf(m.kategori) === valgt;        /* hele gruppen */
}

  $("#d_clear").textContent = t("clear"); $("#csv").textContent = t("csv");
  $("#l_ny").textContent = t("ny_vare");
  $("#p_etiket").textContent = t("print_etiket");
  $("#p_optael").textContent = t("print_optael");
  $("#scanluk").textContent = t("scan_luk");
  document.querySelectorAll(".scanbtn").forEach(b => b.textContent = t("scan"));
  $("#admBtn").textContent = admin ? t("adm_ud") : t("adm_ind");
  $("#demo").textContent = t("demo");
  $("#lag_sub").textContent = admin ? t("lag_s_adm") : t("lag_s");

  const k1 = $("#l_kat").value, k2 = $("#d_kat").value;
  $("#l_kat").innerHTML = katOptions(true); $("#l_kat").value = k1 || "";
  $("#d_kat").innerHTML = katOptions(true); $("#d_kat").value = k2 || "";
  const so = $("#l_sort").value || "navn";
  $("#l_sort").innerHTML = [["navn","s_navn"],["kat","s_kat"],["beh","s_beh"],["plads","s_plads"]]
    .map(([v,k]) => `<option value="${v}">${esc(t(k))}</option>`).join("");
  $("#l_sort").value = so;
  const vi = $("#l_vis").value || "alle";
  $("#l_vis").innerHTML = ["alle","lav","nul","bestilt"]
    .map(v => `<option value="${v}">${esc(t("v_"+v))}</option>`).join("");
  $("#l_vis").value = vi;

  comboUd.sprog(); comboMat.sprog(); comboInd.sprog();
  alt();
}
function alt(){
  genberegn();
  tegnSenest(); tegnLager(); tegnBest(); tegnModt(); tegnStat(); tegnKoe();
}
function roller(){
  ["best","modt","stat","koe"].forEach(k => $(`nav [data-t=${k}]`).hidden = !admin);
  document.querySelectorAll(".adm-only").forEach(e => e.hidden = !admin);
  const aktiv = $("nav button[aria-selected=true]");
  if(!admin && aktiv && aktiv.hidden) $("nav [data-t=reg]").click();
  $("#admBtn").classList.toggle("on", admin);
  $("#admBtn").textContent = admin ? t("adm_ud") : t("adm_ind");
  $("#lag_sub").textContent = admin ? t("lag_s_adm") : t("lag_s");
  tegnLager();
}

  const r = forbrugRows().slice().sort((a,b) => (b.id-a.id)).slice(0,8);
  $("#recent").innerHTML = r.length ? r.map(b => {
    const m = byId(MATS,b.materiale_id), u = byId(UDS,b.udstyr_id);
    return `<div class="rec"><span>${esc(m?matNavn(m):"—")} <b style="font-weight:500">× ${tal(Math.abs(b.antal))}</b>
      <div class="sml">→ ${esc(u?u.navn:"—")}</div></span>
      <span class="sml" style="text-align:right;flex:none">${esc(b.dato)}<br>${esc(b.initialer||"")}</span></div>`;

/* ==================== LAGER ==================== */
function tegnLager(){
  const q = $("#l_sog").value.trim(), kat = $("#l_kat").value,
        vis = $("#l_vis").value, sort = $("#l_sort").value;
  let liste = MATS.filter(m => matcher(m,q) && iKategori(m,kat));
  if(vis === "lav") liste = liste.filter(m => ["low","nul"].includes(niveau(m)));
  if(vis === "nul") liste = liste.filter(m => niveau(m) === "nul");
  if(vis === "bestilt") liste = liste.filter(m => erBestilt(m.id));
  liste.sort((a,b) =>
    sort === "beh"   ? beholdning(a.id) - beholdning(b.id) :
    sort === "kat"   ? (a.kategori||"zzz").localeCompare(b.kategori||"zzz") || matNavn(a).localeCompare(matNavn(b),"da") :
    sort === "plads" ? (a.placering||"zzz").localeCompare(b.placering||"zzz","da") :
                       matNavn(a).localeCompare(matNavn(b),"da"));

  $("#lagerantal").textContent = liste.length+" "+t("antal_varer");
  $("#lagerliste").innerHTML = liste.length ? liste.map(m => {
    if(admin && String(m.id) === String(aaben)) return kortRaekke(m,7);
    if(admin && String(m.id) === String(optaeller)) return optaelRaekke(m,7);
    if(String(m.id) === String(historik)) return historikRaekke(m,7);
    const n = niveau(m);
    return `<tr>
      <td><span class="dot ${n==="ok"?"":n}"></span><button class="navn-knap"
          onclick="historik='${m.id}';aaben=null;optaeller=null;tegnLager()">${esc(matNavn(m))}</button>
        ${manglerDa(m)?`<span class="flagpl">${esc(m.type_pl||"")}</span>`:""}
        ${erBestilt(m.id)?`<span class="tag ord">${esc(t("be_bestilt"))}</span>`:""}
        ${m.placering?`<span class="sml"> · ${esc(m.placering)}</span>`:""}
        ${m.oprettet_af?`<span class="sml"> · ${esc(t("af"))} ${esc(m.oprettet_af)}</span>`:""}
        ${arr(m.aliaser).length?`<div>${arr(m.aliaser).map(a=>`<span class="alias">${esc(a)}</span>`).join("")}</div>`:""}</td>
      <td class="hide-s mono">${numre(m).map(esc).join("<br>")||"—"}</td>
      <td class="hide-s adm-only" ${admin?"":'hidden'}>${esc(arr(m.leverandorer).join(", ")||"—")}</td>
      <td class="hide-s sml">${esc(katNavn(m.kategori)||"—")}</td>
      <td class="num">${harBevaegelse(m.id)?tal(beholdning(m.id)):"—"} <span class="sml">${esc(m.enhed)}</span>
        ${m.minimum>0?`<div class="sml">min ${tal(m.minimum)}</div>`:""}</td>
      <td class="num adm-only" ${admin?"":'hidden'}>${m.pris==null?"—":kr(m.pris)}</td>
      <td class="num adm-only" ${admin?"":'hidden'} style="white-space:nowrap">
        <button class="txt" onclick="aaben='${m.id}';optaeller=null;tegnLager()">${esc(t("ret"))}</button>
        <button class="txt mut" style="margin-left:9px" onclick="optaeller='${m.id}';aaben=null;tegnLager()">${esc(t("optael"))}</button></td></tr>`;
  }).join("") : `<tr><td colspan="7" class="empty">${t("ingen")}</td></tr>`;
}

    <div class="two">

        <div class="sml" style="margin-top:6px">${t("c_optael_h")}</div></div>
      <div class="f"><label class="lab">${t("f_init")}</label><input id="o_init" maxlength="6"></div></div>
    <button class="btn sm" onclick="gemOptael('${m.id}')">${t("gem")}</button>
    <button class="btn alt sm" style="margin-left:8px" onclick="optaeller=null;tegnLager()">${t("luk")}</button></td></tr>`;

async function gemOptael(id){
  const nyt = parseFloat($("#o_antal").value);
  if(isNaN(nyt)){ toast(t("mangler")); return; }
  const diff = nyt - beholdning(id);
  const m = byId(MATS,id);
  if(diff !== 0 || !harBevaegelse(id)){
    await db.addBev({materiale_id:id, antal:diff, art:"optaelling", udstyr_id:null, dato:idag(),
      initialer:$("#o_init").value.trim().toUpperCase(), note:"optælling",
      pris:(m||{}).pris, afdeling:AFDELING});
    BEV = await db.bev();
  }
  optaeller = null; alt(); toast(t("optalt"));
}

}

/* ==================== BESTILLING ==================== */
function tegnBest(){
  const skal = MATS.filter(m => ["low","nul"].includes(niveau(m)) && !erBestilt(m.id))
    .map(m => ({m, b:beholdning(m.id), foreslag:Math.max(1, (m.minimum||1) - beholdning(m.id))}))
    .sort((x,y) => (x.b-(x.m.minimum||0)) - (y.b-(y.m.minimum||0)));

  if(!skal.length) $("#skalbody").innerHTML = `<div class="panel"><div class="empty">${t("be_skal_tom")}</div></div>`;
  else {
    const grup = {};
    skal.forEach(r => { const k = primaerLev(r.m) || "—"; (grup[k] ||= []).push(r); });
    $("#skalbody").innerHTML = Object.entries(grup).map(([lev,rows],gi) => `
      <div class="sec"><h3>${esc(lev)}</h3><span class="hint">${rows.length}</span>

/* ==================== STREGKODESCANNER ====================
   To veje, i den rækkefølge:
   1) browserens indbyggede BarcodeDetector — findes i Chrome på Android og macOS,
      men IKKE på Windows, hvor styresystemet ikke har et stregkode-API.
   2) ellers hentes ZXing fra CDN — men først når man trykker Scan, så siden
      ikke bliver tungere for dem der aldrig scanner.
   Begge kræver HTTPS. Åbner man filen direkte fra skrivebordet, nægter
   browseren adgang til kameraet. */
let scanStream = null, scanStop = false, scanMaal = null, zxReader = null;

function hentZxing(){
  if(window.ZXing) return Promise.resolve(true);
  return new Promise(res => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
    s.onload = () => res(!!window.ZXing);
    s.onerror = () => res(false);
    document.head.appendChild(s);
  });
}
async function aabnScanner(maalId){
  scanMaal = maalId; scanStop = false;
  const modal = $("#scanmodal"), video = $("#scanvideo"), status = $("#scanstatus");
  if(!window.isSecureContext){ toast(t("scan_https")); return; }
  modal.hidden = false; status.textContent = "";

  if("BarcodeDetector" in window){
    try{ scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}); }
    catch(e){ lukScanner(); toast(t("scan_naegtet")); return; }
    video.srcObject = scanStream;
    await video.play().catch(()=>{});
    const det = new window.BarcodeDetector({formats:["ean_13","ean_8","code_128","qr_code"]});
    (async function loop(){
      while(!scanStop){
        try{
          const fund = await det.detect(video);
          if(fund && fund.length){ haandterKode(fund[0].rawValue); return; }
        }catch(e){ /* et enkelt mislykket frame er normalt */ }
        await new Promise(r => setTimeout(r, 220));
      }
    })();
    return;
  }

  status.textContent = t("scan_henter");
  const ok = await hentZxing();
  if(!ok){ lukScanner(); toast(t("scan_fejl")); return; }
  if(scanStop) return;
  status.textContent = "";
  try{
    zxReader = new window.ZXing.BrowserMultiFormatReader();
    await zxReader.decodeFromConstraints({video:{facingMode:"environment"}}, video,
      (res, err) => { if(res && !scanStop) haandterKode(res.getText()); });
  }catch(e){ lukScanner(); toast(t("scan_naegtet")); }
}
function lukScanner(){
  scanStop = true;
  if(zxReader){ try{ zxReader.reset(); }catch(e){} zxReader = null; }
  if(scanStream){ scanStream.getTracks().forEach(x => x.stop()); scanStream = null; }
  const v = $("#scanvideo");
  if(v.srcObject){ v.srcObject.getTracks().forEach(x => x.stop()); v.srcObject = null; }
  $("#scanstatus").textContent = "";
  $("#scanmodal").hidden = true;
}
function haandterKode(kode){
  kode = String(kode).trim();
  lukScanner();
  const m = MATS.find(x => x.ean === kode || x.elnr === kode || x.modelnr === kode);
  const felt = $("#"+scanMaal);
  if(!m){
    if(felt){ felt.value = kode; felt.dispatchEvent(new Event("input",{bubbles:true})); }
    toast(t("scan_ukendt")); return;
  }
  if(scanMaal === "l_sog"){ felt.value = m.ean || matNavn(m); tegnLager(); }
  else (scanMaal === "q_mat" ? comboMat : comboInd).saet(m);
  toast(matNavn(m));
}

});

/* ==================== EAN-13 SOM SVG ====================
   Til hyldeetiketter: samme stregkode som på varen, så scanneren kan læse den. */
const EAN_L=["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
const EAN_G=["0100111","0110011","0011011","0100001","0011101","0111001","0000101","0010001","0001001","0010111"];
const EAN_R=["1110010","1100110","1101100","1000010","1011100","1001110","1010000","1000100","1001000","1110100"];
const EAN_P=["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
function ean13gyldig(s){
  if(!/^\d{13}$/.test(s)) return false;
  let sum = 0;
  for(let i=0;i<12;i++) sum += (+s[i]) * (i%2 ? 3 : 1);
  return (10 - sum%10) % 10 === +s[12];
}
function ean13svg(s,h){
  if(!ean13gyldig(s)) return "";
  const d = s.split("").map(Number), pat = EAN_P[d[0]];
  let bits = "101";
  for(let i=1;i<=6;i++) bits += (pat[i-1]==="L" ? EAN_L : EAN_G)[d[i]];
  bits += "01010";
  for(let i=7;i<=12;i++) bits += EAN_R[d[i]];
  bits += "101";
  const bar = [];
  for(let i=0;i<bits.length;i++) if(bits[i]==="1")
    bar.push(`<rect x="${i}" y="0" width="1" height="${h}" fill="#000"/>`);
  return `<svg viewBox="0 0 95 ${h}" width="100%" height="${h}" preserveAspectRatio="none"
    shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">${bar.join("")}</svg>`;
}

/* ==================== PRINT ====================
   Printer altid PRÆCIS den liste der står på skærmen — så filtrene bestemmer,
   om du printer én hylde, én kategori eller hele lageret. */
function filtreretListe(){

  let l = MATS.filter(m => matcher(m,q) && iKategori(m,kat));
  if(vis === "lav") l = l.filter(m => ["low","nul"].includes(niveau(m)));
  if(vis === "nul") l = l.filter(m => niveau(m) === "nul");
  if(vis === "bestilt") l = l.filter(m => erBestilt(m.id));
  return l;
}

function printEtiketter(){
  const l = filtreretListe().slice()
    .sort((a,b) => (a.placering||"zzz").localeCompare(b.placering||"zzz","da"));
  if(!l.length){ toast(t("p_intet")); return; }
  const krop = `<div class="ark">` + l.map(m => `
    <div class="etiket">
      <div class="plads">${esc(m.placering || "—")}</div>
      <div class="navn">${esc(matNavn(m))}</div>
      <div class="nr">${m.elnr ? "EL "+esc(m.elnr) : esc(m.modelnr||"")}</div>
      <div class="kode">${ean13svg(m.ean||"", 28) || ""}</div>
      <div class="ean">${esc(m.ean||"")}</div>
    </div>`).join("") + `</div>`;
  printVindue(t("p_etiket_h"), krop, `
    .ark{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}
    .etiket{border:1px solid #D7DBD0;border-radius:2px;padding:3mm;height:32mm;
      display:flex;flex-direction:column;page-break-inside:avoid}
    .plads{font:600 13px Raleway;letter-spacing:.04em}
    .navn{font-size:11px;line-height:1.25;margin:1mm 0;flex:1;overflow:hidden}
    .nr{font-size:10px;color:#66705F}
    .kode{margin-top:auto}
    .ean{font-size:9px;letter-spacing:.14em;text-align:center;color:#66705F}`);
}
function printOptaelling(){
  const l = filtreretListe().slice()
    .sort((a,b) => (a.placering||"zzz").localeCompare(b.placering||"zzz","da")
      || matNavn(a).localeCompare(matNavn(b),"da"));
  if(!l.length){ toast(t("p_intet")); return; }
  const krop = `<div class="vejl">${esc(t("p_vejl"))}</div>
    <table><thead><tr>
      <th>${t("p_hylde")}</th><th>${t("t_vare")}</th><th>${t("c_elnr")}</th>
      <th class="n">${t("t_beh")}</th><th class="n b">${t("p_optalt")}</th></tr></thead>
    <tbody>` + l.map(m => `<tr>
      <td>${esc(m.placering||"")}</td>
      <td>${esc(matNavn(m))}</td>
      <td class="mono">${esc(m.elnr||m.modelnr||"")}</td>
      <td class="n">${harBevaegelse(m.id) ? tal(beholdning(m.id))+" "+esc(m.enhed) : "—"}</td>
      <td class="n b"></td></tr>`).join("") + `</tbody></table>`;
  printVindue(t("p_optael_h"), krop, `
    .vejl{font-size:11px;margin-bottom:10px}
    table{width:100%;border-collapse:collapse}
    th{text-align:left;font:600 9px Raleway;letter-spacing:.1em;text-transform:uppercase;
      color:#66705F;border-bottom:1px solid #082600;padding:5px 6px}
    td{padding:6px;border-bottom:1px solid #E4E7DE}
    .n{text-align:right}
    .b{width:26mm;border-left:1px solid #D7DBD0;background:#F4F4EF}
    .mono{font-size:11px}
    tr{page-break-inside:avoid}`);
}
$("#p_etiket").onclick = printEtiketter;
$("#p_optael").onclick = printOptaelling;

/* ==================== ADGANG + FANER ==================== */
$("#langs").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  lang = b.dataset.l;
  document.querySelectorAll("#langs button").forEach(x => x.setAttribute("aria-pressed", x===b));
  tekster();
};
$("#nav").onclick = e => {
  const b = e.target.closest("button"); if(!b || b.hidden) return;
  document.querySelectorAll("#nav button").forEach(x => x.setAttribute("aria-selected", x===b));
  ["reg","lager","best","modt","stat","koe"].forEach(k => $("#"+k).hidden = b.dataset.t !== k);
};
$("#admBtn").onclick = async () => {
  if(admin){ admin = false; aaben = null; optaeller = null; roller(); return; }
  const kode = prompt(t("adm_kode")); if(kode == null) return;
  const ok = DEMO ? kode === ADMIN_KODE_DEMO : await tjekKode(kode);
  if(!ok){ toast(t("adm_fejl")); return; }
  admin = true; roller(); $("nav [data-t=best]").click();
};
/* Live: koden tjekkes i en Edge Function — aldrig i denne fil. Se README. */
async function tjekKode(kode){
  try{ const {data,error} = await sb.functions.invoke("check-access",{body:{kode,app:"reservedele"}});
    return !error && data && data.ok === true; } catch(e){ return false; }
}
$("#d_fra").onchange = tegnStat; $("#d_til").onchange = tegnStat; $("#d_kat").onchange = tegnStat;
$("#d_clear").onclick = () => { $("#d_fra").value=""; $("#d_til").value=""; $("#d_kat").value=""; tegnStat(); };
$("#csv").onclick = () => {
  const rows = forbrugRows().filter(b => iPeriode(b.dato));
  const l = [["Dato","Type","Model","EL-nr","EAN","Model-nr","Kategori","Leverandør","Antal","Enhed",
              "Anlægsnr","Udstyrstype","Udstyrsmodel","Ressourcenr","Initialer","Beløb","Afdeling"].join(";")];
  rows.forEach(b => { const m = byId(MATS,b.materiale_id)||{}, u = byId(UDS,b.udstyr_id)||{};
    l.push([b.dato, m.type_da||m.type_pl||"", m.model||"", m.elnr||"", m.ean||"", m.modelnr||"",
      m.kategori||"", arr(m.leverandorer).join(" / "), String(Math.abs(b.antal)).replace(".",","),
      m.enhed||"", u.navn||"", u.type||"", u.model||"", u.ressourcenr||"", b.initialer||"",
      String(Math.round(belob(b)*100)/100).replace(".",","), b.afdeling||AFDELING].join(";")); });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff"+l.join("\n")],{type:"text/csv;charset=utf-8"}));
  a.download = "reservedele_"+AFDELING+"_"+idag()+".csv"; a.click();
};
